name: Build IFC Merge.exe

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Quick test of the merge core
        run: |
          python tests/make_test_models.py
          python merge_core.py tests/models/A_architect.ifc tests/models/A_mep.ifc tests/models/A_structure.ifc tests/models/B_architect.ifc -o tests/models/merged.ifc

      - name: Build the exe
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "IFC Merge" `
            --collect-all ifcopenshell --collect-all ifcpatch --collect-all tkinterdnd2 `
            --hidden-import numpy ifc_merge_app.py

      - name: Upload IFC Merge.exe
        uses: actions/upload-artifact@v4
        with:
          name: IFC-Merge-windows
          path: dist/IFC Merge.exe
          retention-days: 90
